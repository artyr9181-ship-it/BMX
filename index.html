<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMX Community</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; background:#111; color:white; text-align:center; }
    input, button { padding:10px; margin:5px; width:300px; }
    .post { background:#222; margin:10px auto; padding:10px; width:400px; border-radius:10px; }
    iframe { width:100%; height:200px; }
  </style>
</head>

<body>

<h1>🚴 BMX COMMUNITY</h1>

<input id="video" placeholder="paste YouTube link">
<button onclick="addPost()">Post</button>

<div id="feed"></div>

<script>
const supabase = supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
)

async function addPost(){
  const url = document.getElementById("video").value

  await supabase.from("posts").insert([{ url: url, likes: 0 }])

  document.getElementById("video").value = ""
  loadPosts()
}

async function like(id, likes){
  await supabase.from("posts")
    .update({ likes: likes + 1 })
    .eq("id", id)

  loadPosts()
}

function getId(url){
  const match = url.match(/v=([^&]+)/)
  return match ? match[1] : url
}

async function loadPosts(){
  const { data } = await supabase.from("posts").select("*").order("id", { ascending:false })

  document.getElementById("feed").innerHTML = ""

  data.forEach(p => {
    const videoId = getId(p.url)

    document.getElementById("feed").innerHTML += `
      <div class="post">
        <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
        <p>❤️ ${p.likes}</p>
        <button onclick="like(${p.id}, ${p.likes})">Like</button>
      </div>
    `
  })
}

loadPosts()
</script>

</body>
</html>
