<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BMX COMMUNITY</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: none;
  border-radius: 6px;
}

button {
  background: #ff3b3b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.post {
  background: #1a1a1a;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 6px;
}

.like {
  margin-top: 8px;
  cursor: pointer;
  color: #aaa;
}

.liked {
  color: #ff3b3b;
}
</style>
</head>

<body>

<div class="container">
  <input id="input" placeholder="Paste YouTube link">
  <button onclick="addPost()">POST</button>
  <div id="feed"></div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem("bmx_posts") || "[]");

function getVideoId(url) {
  if (!url) return null;

  const patterns = [
    /youtu\.be\/([\w-]+)/,
    /v=([\w-]+)/,
    /shorts\/([\w-]+)/
  ];

  for (let p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }

  return null;
}

function save() {
  localStorage.setItem("bmx_posts", JSON.stringify(posts));
}

function render() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  posts.forEach((p, i) => {
    const vid = getVideoId(p.url);

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      ${vid
        ? `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`
        : `<a href="${p.url}" target="_blank">${p.url}</a>`}

      <div class="like ${p.liked ? 'liked' : ''}" onclick="likePost(${i})">
        👍 Like (${p.likes || 0})
      </div>
    `;

    feed.appendChild(div);
  });
}

function addPost() {
  const input = document.getElementById("input");
  const url = input.value.trim();

  if (!url) return;

  posts.unshift({
    url: url,
    likes: 0,
    liked: false
  });

  input.value = "";
  save();
  render();
}

function likePost(i) {
  if (!posts[i].liked) {
    posts[i].likes++;
    posts[i].liked = true;
  } else {
    posts[i].likes--;
    posts[i].liked = false;
  }

  save();
  render();
}

render();
</script>

</body>
</html>
