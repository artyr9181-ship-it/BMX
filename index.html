<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMX COMMUNITY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff3b3b;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    .post {
      background: #1a1a1a;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 300px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .like {
      margin-top: 10px;
      cursor: pointer;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>🔥 BMX COMMUNITY</header>

<div class="container">

  <input id="input" placeholder="Paste YouTube link...">
  <button onclick="addPost()">Post</button>

  <div id="feed"></div>

</div>

<script>
const client = supabase.createClient(
  "https://wthemojykufxrxhmudyq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aGVtb2p5a3VmeHJ4aG11ZHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzQ1ODMsImV4cCI6MjA5MDcxMDU4M30.d57cpLLVM3CPLbt7yk-F3ZsvkoR0PYKVyvi35RiKtGE"
);

function getYouTubeID(url) {
  if (!url) return null;

  const match = url.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]+)/);
  return match ? match[1] : null;
}

async function loadPosts() {
  const { data, error } = await client
    .from("posts")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.log("LOAD ERROR:", error);
    return;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(p => {

    const url = p.url;

    const videoId = getYouTubeID(url);

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      ${videoId
        ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`
        : `<a href="${url}" target="_blank">${url}</a>`}

      <div class="like" onclick="likePost(${p.id}, ${p.likes})">
        👍 Like (${p.likes})
      </div>
    `;

    feed.appendChild(div);
  });
}

async function addPost() {
  const input = document.getElementById("input");
  if (!input.value) return;

  const { error } = await client.from("posts").insert([{
    url: input.value,
    likes: 0
  }]);

  if (error) {
    console.log("INSERT ERROR:", error);
    return;
  }

  input.value = "";
  loadPosts();
}

async function likePost(id, likes) {
  await client
    .from("posts")
    .update({ likes: likes + 1 })
    .eq("id", id);

  loadPosts();
}

loadPosts();
</script>

</body>
</html>
