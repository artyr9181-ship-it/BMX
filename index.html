<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-family:Arial">

<input id="input" placeholder="link">
<button onclick="add()">POST</button>

<div id="feed"></div>

<script>
let posts = JSON.parse(localStorage.getItem("p") || "[]");

function add(){
  const val = document.getElementById("input").value;
  posts.push({text: val, likes:0});
  localStorage.setItem("p", JSON.stringify(posts));
  render();
}

function render(){
  let html = "";
  posts.forEach((p,i)=>{
    html += `
      <div>
        ${p.text}
        <button onclick="like(${i})">👍 ${p.likes}</button>
      </div>
    `;
  });
  document.getElementById("feed").innerHTML = html;
}

function like(i){
  posts[i].likes++;
  localStorage.setItem("p", JSON.stringify(posts));
  render();
}

render();
</script>

</body>
</html>
