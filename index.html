<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let client = null;

window.addEventListener("load", async () => {

  if (!window.supabase) {
    document.body.innerHTML = "Supabase не загрузился";
    return;
  }

  client = supabase.createClient(
    "https://wthemojykufxrxhmudyq.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aGVtb2p5a3VmeHJ4aG11ZHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzQ1ODMsImV4cCI6MjA5MDcxMDU4M30.d57cpLLVM3CPLbt7yk-F3ZsvkoR0PYKVyvi35RiKtGE"
  );

  console.log("Supabase OK");

  await loadPosts();
});

function getYouTubeID(url) {
  if (!url) return null;
  const match = url.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]+)/);
  return match ? match[1] : null;
}

async function loadPosts() {
  if (!client) return;

  const { data, error } = await client
    .from("posts")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.log("LOAD ERROR:", error);
    return;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(p => {
    const div = document.createElement("div");
    div.className = "post";

    const videoId = getYouTubeID(p.url);

    div.innerHTML = `
      ${videoId
        ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`
        : `<a href="${p.url}" target="_blank">${p.url}</a>`}

      <div class="like" onclick="likePost(${p.id}, ${p.likes})">
        👍 Like (${p.likes})
      </div>
    `;

    feed.appendChild(div);
  });
}

async function addPost() {
  if (!client) return;

  const input = document.getElementById("input");
  if (!input.value) return;

  const { error } = await client.from("posts").insert([{
    url: input.value,
    likes: 0
  }]);

  if (error) {
    console.log("INSERT ERROR:", error);
    return;
  }

  input.value = "";
  loadPosts();
}

async function likePost(id, likes) {
  if (!client) return;

  await client
    .from("posts")
    .update({ likes: likes + 1 })
    .eq("id", id);

  loadPosts();
}
</script>
