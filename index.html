<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BMX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="background:black;color:white;font-family:Arial">

<input id="input" placeholder="YouTube link">
<button onclick="addPost()">POST</button>

<div id="feed"></div>

<script>
const supabaseUrl = "https://wthemojykufxrxhmudyq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aGVtb2p5a3VmeHJ4aG11ZHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzQ1ODMsImV4cCI6MjA5MDcxMDU4M30.d57cpLLVM3CPLbt7yk-F3ZsvkoR0PYKVyvi35RiKtGE";

const client = supabase.createClient(supabaseUrl, supabaseKey);

async function load(){
  const { data, error } = await client
    .from("posts")
    .select("*")
    .order("id", { ascending:false });

  if(error){
    alert("LOAD ERROR: " + JSON.stringify(error));
    console.log(error);
    return;
  }

  render(data || []);
}

function render(posts){
  let html = "";

  posts.forEach(p=>{
    const videoId = getId(p.url);

    html += `
      <div style="margin:10px;padding:10px;border:1px solid #333">
        ${
          videoId
          ? `<iframe width="100%" height="200"
              src="https://www.youtube.com/embed/${videoId}"
              frameborder="0" allowfullscreen></iframe>`
          : p.url
        }

        <br>

        <button onclick="likePost(${p.id}, ${p.likes || 0})">
          👍 ${p.likes || 0}
        </button>
      </div>
    `;
  });

  document.getElementById("feed").innerHTML = html;
}

async function addPost(){
  const url = document.getElementById("input").value.trim();
  if(!url) return;

  const { error } = await client
    .from("posts")
    .insert([{ url, likes: 0 }]);

  if(error){
    alert("INSERT ERROR: " + JSON.stringify(error));
    console.log(error);
    return;
  }

  document.getElementById("input").value = "";
  load();
}

async function likePost(id, likes){
  const { error } = await client
    .from("posts")
    .update({ likes: likes + 1 })
    .eq("id", id);

  if(error){
    alert("LIKE ERROR: " + JSON.stringify(error));
    console.log(error);
    return;
  }

  load();
}

function getId(url){
  if(!url) return null;

  const m = url.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]+)/);
  return m ? m[1] : null;
}

load();
</script>

</body>
</html>
