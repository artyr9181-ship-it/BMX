<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMX Community</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; background:#111; color:white; text-align:center; }
    input, button { padding:10px; margin:5px; width:320px; }
    .post { background:#222; margin:10px auto; padding:10px; width:420px; border-radius:10px; }
    iframe { width:100%; height:220px; border-radius:10px; }
  </style>
</head>

<body>

<h1>🚴 BMX COMMUNITY</h1>

<input id="video" placeholder="Paste YouTube link">
<button onclick="addPost()">Post</button>

<div id="feed"></div>

<script>
const supabase = supabase.createClient(
  "https://wthemojykufxrxhmudyq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
)

async function addPost(){
  const url = document.getElementById("video").value
  if(!url) return

  await supabase.from("posts").insert([{ url, likes: 0 }])

  document.getElementById("video").value = ""
  loadPosts()
}

function getVideoId(url){
  const match = url.match(/v=([^&]+)/)
  return match ? match[1] : url
}

async function like(id, likes){
  await supabase.from("posts")
    .update({ likes: likes + 1 })
    .eq("id", id)

  loadPosts()
}

async function loadPosts(){
  const { data } = await supabase
    .from("posts")
    .select("*")
    .order("id", { ascending:false })

  const feed = document.getElementById("feed")
  feed.innerHTML = ""

  data.forEach(p => {
    const videoId = getVideoId(p.url)

    feed.innerHTML += `
      <div class="post">
        <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
        <p>❤️ ${p.likes || 0}</p>
        <button onclick="like(${p.id}, ${p.likes || 0})">Like</button>
      </div>
    `
  })
}

loadPosts()
</script>

</body>
</html>
