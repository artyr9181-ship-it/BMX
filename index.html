
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMX COMMUNITY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff3b3b;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    .post {
      background: #1a1a1a;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 300px;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>🔥 BMX COMMUNITY</header>

<div class="container">

  <input id="input" placeholder="Paste YouTube link...">
  <button onclick="addPost()">Post</button>

  <div id="feed">Loading...</div>

</div>

<script>
let client = null;

window.onload = async function () {

  if (!window.supabase) {
    document.body.innerHTML = "Supabase not loaded";
    return;
  }

  client = supabase.createClient(
    "https://wthemojykufxrxhmudyq.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aGVtb2p5a3VmeHJ4aG11ZHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzQ1ODMsImV4cCI6MjA5MDcxMDU4M30.d57cpLLVM3CPLbt7yk-F3ZsvkoR0PYKVyvi35RiKtGE"
  );

  await loadPosts();
};

function getYouTubeID(url) {
  if (!url) return null;

  const clean = url.trim();

  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
    /v=([a-zA-Z0-9_-]{6,})/,
    /shorts\/([a-zA-Z0-9_-]{6,})/
  ];

  for (const p of patterns) {
    const match = clean.match(p);
    if (match) return match[1];
  }

  return null;
}

async function loadPosts() {
  if (!client) return;

  const { data, error } = await client
    .from("posts")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(p => {

    const url = (p.url || "").trim();
    const videoId = getYouTubeID(url);

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = videoId
      ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`
      : `<a href="${url}" target="_blank">${url}</a>`;

    feed.appendChild(div);
  });
}

async function addPost() {
  if (!client) return;

  const input = document.getElementById("input");
  const url = input.value.trim();

  if (!url.includes("http")) {
    alert("Insert valid YouTube link");
    return;
  }

  const { error } = await client.from("posts").insert([{
    url,
    likes: 0
  }]);

  if (error) {
    console.log("INSERT ERROR:", error);
    return;
  }

  input.value = "";
  loadPosts();
}
</script>

</body>
</html>
