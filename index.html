<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMX COMMUNITY</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff3b3b;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    .post {
      background: #1a1a1a;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 300px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .like {
      margin-top: 10px;
      cursor: pointer;
      color: #aaa;
    }

    .liked {
      color: #ff3b3b;
    }
  </style>
</head>

<body>

<header>🔥 BMX COMMUNITY</header>

<div class="container">

  <input id="input" placeholder="Paste YouTube link...">
  <button onclick="addPost()">Post</button>

  <div id="feed"></div>

</div>

<script>
let posts = JSON.parse(localStorage.getItem("bmx_posts") || "[]");

function getYouTubeID(url) {
  const match = url.match(/(?:youtu\.be\/|v=)([\w-]+)/);
  return match ? match[1] : null;
}

function render() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  posts.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "post";

    const videoId = getYouTubeID(p.text);

    div.innerHTML = `
      ${videoId ? `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>` 
                 : `<a href="${p.text}" target="_blank">${p.text}</a>`}

      <div class="like ${p.liked ? 'liked' : ''}" onclick="toggleLike(${i})">
        👍 Like (${p.likes})
      </div>
    `;

    feed.prepend(div);
  });
}

function addPost() {
  const input = document.getElementById("input");
  if (!input.value) return;

  posts.push({
    text: input.value,
    likes: 0,
    liked: false
  });

  input.value = "";
  save();
  render();
}

function toggleLike(i) {
  if (!posts[i].liked) {
    posts[i].likes++;
    posts[i].liked = true;
  } else {
    posts[i].likes--;
    posts[i].liked = false;
  }

  save();
  render();
}

function save() {
  localStorage.setItem("bmx_posts", JSON.stringify(posts));
}

render();
</script>

</body>
</html>
