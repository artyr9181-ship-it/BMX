<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMX COMMUNITY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .post {
      background: #1a1a1a;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 300px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .like {
      margin-top: 10px;
      cursor: pointer;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>🔥 BMX COMMUNITY</header>

<div class="container">

  <input id="input" placeholder="Paste YouTube link...">
  <button onclick="addPost()">Post</button>

  <div id="feed">Loading...</div>

</div>

<script>
let client = null;

window.onload = async function () {

  if (!window.supabase) {
    document.body.innerHTML = "Supabase library not loaded";
    return;
  }

  client = supabase.createClient(
    "https://wthemojykufxrxhmudyq.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aGVtb2p5a3VmeHJ4aG11ZHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzQ1ODMsImV4cCI6MjA5MDcxMDU4M30.d57cpLLVM3CPLbt7yk-F3ZsvkoR0PYKVyvi35RiKtGE"
  );

  await loadPosts();
};

function getYouTubeID(url) {
  if (!url) return null;
  const match = url.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]+)/);
  return match ? match[1] : null;
}

async function loadPosts() {
  if (!client) return;

  const { data, error } = await client
    .from("posts")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(p => {
    const videoId = getYouTubeID(p.url || "");

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = videoId
      ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`
      : `<a href="${p.url}" target="_blank">${p.url}</a>`;

    feed.appendChild(div);
  });
}

async function addPost() {
  if (!client) return;

  const input = document.getElementById("input");
  if (!input.value) return;

  await client.from("posts").insert([{
    url: input.value,
    likes: 0
  }]);

  input.value = "";
  loadPosts();
}
</script>

</body>
</html>
