<!DOCTYPE html>
<html>
<head>
  <title>BMX Community</title>
</head>
<body style="font-family: Arial; text-align:center; background:#111; color:white;">

<h1>🔥 BMX COMMUNITY</h1>

<p>Share BMX videos</p>

<input id="video" placeholder="Paste link">
<button onclick="post()">Post</button>

<div id="feed"></div>

<script>
function post() {
  const url = document.getElementById('video').value;

  const div = document.createElement('div');
  div.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
  document.getElementById('feed').prepend(div);
}
</script>

</body>
</html>
