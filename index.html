<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BMX COMMUNITY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 24px;
  background: #111;
  border-bottom: 1px solid #333;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: none;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 12px;
  background: #ff3b3b;
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
}

.post {
  background: #1a1a1a;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
}

iframe {
  width: 100%;
  height: 300px;
  margin-top: 10px;
  border-radius: 8px;
}

.like {
  margin-top: 10px;
  cursor: pointer;
  color: #aaa;
}
</style>
</head>

<body>

<header>🔥 BMX COMMUNITY</header>

<div class="container">

<input id="input" placeholder="Paste YouTube link...">
<button onclick="addPost()">Post</button>

<div id="feed"></div>

</div>

<script>
const supabaseUrl = "SUPABASE_URL";
const supabaseKey = "SUPABASE_ANON_KEY";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let posts = [];

function getYouTubeID(url) {
  const match = url.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]+)/);
  return match ? match[1] : null;
}

async function loadPosts() {
  const { data, error } = await client
    .from("posts")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.log("LOAD ERROR:", error);
    return;
  }

  posts = data;
  render();
}

function render() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  posts.forEach((p) => {
    const videoId = getYouTubeID(p.url);

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      ${videoId ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>` 
                 : `<a href="${p.url}" target="_blank">${p.url}</a>`}

      <div class="like" onclick="toggleLike(${p.id}, ${p.likes || 0})">
        👍 Like (${p.likes || 0})
      </div>
    `;

    feed.appendChild(div);
  });
}

async function addPost() {
  const input = document.getElementById("input");
  const url = input.value.trim();

  if (!url) return;

  const { error } = await client
    .from("posts")
    .insert([{ url, likes: 0 }]);

  if (error) {
    console.log("INSERT ERROR:", error);
    alert(error.message);
    return;
  }

  input.value = "";
  loadPosts();
}

async function toggleLike(id, likes) {
  const newLikes = (likes || 0) + 1;

  const { error } = await client
    .from("posts")
    .update({ likes: newLikes })
    .eq("id", id);

  if (error) {
    console.log("LIKE ERROR:", error);
    return;
  }

  loadPosts();
}

loadPosts();
</script>

</body>
</html>
